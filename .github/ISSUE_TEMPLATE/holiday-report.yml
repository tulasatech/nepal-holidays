name: Report a problem with the holiday list
description: A holiday that isn't listed, or a listed day that is a working day.
title: "Report: "
labels: ["holiday-report"]
body:
  - type: markdown
    attributes:
      value: |
        One day per report. Please link the notice that shows it.
  - type: dropdown
    id: report
    attributes:
      label: Report
      options:
        - A holiday is missing
        - A listed holiday is a working day
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Gregorian (AD) date, YYYY-MM-DD.
      placeholder: "2026-10-21"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: For a missing holiday, its English name.
      placeholder: Vijaya Dashami
  - type: input
    id: name_ne
    attributes:
      label: Name in Nepali
      placeholder: विजया दशमी
  - type: dropdown
    id: banks_closed
    attributes:
      label: Banks closed
      description: For a missing holiday, are banks and payment settlement closed that day?
      options:
        - "yes"
        - "no"
  - type: input
    id: applies_to
    attributes:
      label: Applies to
      description: For a missing holiday, leave blank if nationwide. Otherwise e.g. women only, Koshi Province, Kathmandu Valley.
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the notice (Ministry of Home Affairs, Nepal Rastra Bank, provincial government).
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
